<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Vertical Bar Chart with Confidence Bars</title>
  </head>
  <body style="margin: 0; padding: 0">
    <link href="../sszvis.css" rel="stylesheet" />
    <script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
    <script src="../sszvis.js"></script>

    <div id="sszvis-chart"></div>

    <script>
      var EXTERNAL_CONFIG = {
        data: "data/nested.csv",
        id: "#sszvis-chart",
        fallback: "fallback.png",
      };
    </script>

    <script data-catalog-project-expose="script.js">
      (function (d3, sszvis, config) {
        "use strict";

        // Configuration
        // -----------------------------------------------

        var MAX_WIDTH = 800;
        var queryProps = sszvis
          .responsiveProps()
          .prop("bottomPadding", {
            palm: 140,
            _: 120,
          })
          .prop("leftPadding", {
            palm: 40,
            _: 20,
          })
          .prop("rightPadding", {
            _: 20,
          });

        // Helper function to parse confidence intervals in "X bis Y" format
        function parseConfidenceInterval(confidenceStr) {
          if (!confidenceStr || confidenceStr === "") {
            return { lower: null, upper: null };
          }
          var parts = confidenceStr.split(" bis ");
          if (parts.length === 2) {
            return {
              lower: sszvis.parseNumber(parts[0]),
              upper: sszvis.parseNumber(parts[1]),
            };
          }
          return { lower: null, upper: null };
        }

        var xAcc = sszvis.prop("ageGroup");
        var yAcc = sszvis.prop("value");
        var cAcc = sszvis.prop("response");
        var genderAcc = sszvis.prop("gender");
        var lowAcc = sszvis.prop("confidenceLower");
        var highAcc = sszvis.prop("confidenceUpper");

        // Application state
        // -----------------------------------------------
        var state = {
          data: [],
          filteredData: [],
          ageGroups: [],
          responses: [],
          genders: [],
          selectedYear: "2021",
          selectedGender: "Weiblich",
          selection: null,
          groupedData: [],
        };

        // State transitions
        // -----------------------------------------------
        var actions = {
          prepareState: function prepareState(data) {
            state.data = data;
            state.ageGroups = sszvis.set(state.data, xAcc);
            state.responses = sszvis.set(state.data, cAcc);
            state.genders = sszvis.set(state.data, genderAcc);

            // Filter data for initial display
            state.filteredData = state.data.filter(function (d) {
              return (
                d.year === state.selectedYear &&
                genderAcc(d) === state.selectedGender
              );
            });

            // Group data by age group
            state.groupedData = sszvis
              .cascade()
              .arrayBy(xAcc)
              .apply(state.filteredData);

            render();
          },

          showTooltip: function showTooltip(_e, datum) {
            if (state.selection !== datum) {
              state.selection = datum;
              render();
            }
          },

          hideTooltip: function hideTooltip() {
            if (state.selection !== null) {
              state.selection = null;
              render();
            }
          },

          resize: function resize() {
            render();
          },
        };

        // Data initialization
        // -----------------------------------------------
        d3.csv(config.data, function (d) {
          return {
            ageGroup: d["Alter_F"],
            gender: d["Geschlecht_F"],
            response: d["Auspraegung_F"],
            value: sszvis.parseNumber(d["Anteil (in %)"]),
            confidenceLower: parseConfidenceInterval(
              d["95 % Konfidenzintervall (in %)"],
            ).lower,
            confidenceUpper: parseConfidenceInterval(
              d["95 % Konfidenzintervall (in %)"],
            ).upper,
            year: d["Jahr_F"],
          };
        })
          .then(actions.prepareState)
          .catch(sszvis.loadError);

        // Viewport resize handler
        sszvis.viewport.on("resize", actions.resize);

        // Render
        // -----------------------------------------------
        function render() {
          if (state.filteredData.length === 0) return;

          var props = queryProps(sszvis.measureDimensions(config.id));
          // Create proper color legend layout for consistent colors
          var legendLayout = sszvis.colorLegendLayout(
            {
              axisLabels: state.ageGroups,
              legendLabels: state.responses,
            },
            config.id,
          );

          // Calculate bounds
          var yMax = d3.max(state.filteredData, yAcc);
          var bounds = sszvis.bounds(
            {
              top: 30,
              bottom: props.bottomPadding,
              left: props.leftPadding,
              right: props.rightPadding,
            },
            config.id,
          );

          var chartWidth = Math.min(MAX_WIDTH, bounds.innerWidth);

          // Scales
          var xScale = d3
            .scaleBand()
            .domain(state.ageGroups)
            .range([0, chartWidth])
            .paddingOuter(0.2)
            .padding(0.26);

          var yScale = d3
            .scaleLinear()
            .domain([0, yMax * 1.1]) // Add some padding for error bars
            .range([bounds.innerHeight, 0]);

          var colorScale = legendLayout.scale;
          var colorLegend = legendLayout.legend;

          // Layers
          var chartLayer = sszvis.createSvgLayer(config.id, bounds);
          var tooltipLayer = sszvis
            .createHtmlLayer(config.id, bounds)
            .datum(state.selection);

          // Create grouped bars layout
          var longestGroup = d3.max(state.groupedData, function (d) {
            return d.length;
          });

          var barLayout = sszvis
            .groupedBars()
            .groupScale(sszvis.compose(xScale, xAcc))
            .groupWidth(xScale.bandwidth())
            .groupSize(longestGroup)
            .y(sszvis.compose(yScale, yAcc))
            .height(
              sszvis.compose(function (d) {
                return bounds.innerHeight - yScale(d);
              }, yAcc),
            )
            .fill(sszvis.compose(colorScale, cAcc))
            .defined(
              sszvis.compose(function (d) {
                return !Number.isNaN(d);
              }, yAcc),
            );

          // Error bars component
          var errorBars = sszvis
            .annotationConfidenceBar()
            .groupScale(sszvis.compose(xScale, xAcc))
            .groupWidth(xScale.bandwidth())
            .groupSize(longestGroup)
            .confidenceLow(
              sszvis.compose(function (d) {
                return yScale(d || 0);
              }, lowAcc),
            )
            .confidenceHigh(
              sszvis.compose(function (d) {
                return yScale(d || 0);
              }, highAcc),
            )
            .width(8); // Width of horizontal caps

          // Components
          var xAxis = sszvis
            .axisX()
            .scale(xScale)
            .orient("bottom")
            .slant("diagonal")
            .tickFormat(props.xLabelFormat)
            .highlightTick(function (d) {
              return state.selection && xAcc(state.selection) === d;
            });

          var yAxis = sszvis
            .axisY()
            .scale(yScale)
            .orient("left")
            .title("Anteil (in %)")
            .tickFormat(function (d) {
              return "".concat(d, "%");
            });

          var tooltip = sszvis
            .tooltip()
            .renderInto(tooltipLayer)
            .orientation(sszvis.fitTooltip("bottom", bounds))
            .header(
              sszvis.modularTextHTML().plain(function (d) {
                return "".concat(xAcc(d), " - ").concat(cAcc(d));
              }),
            )
            .body(function (d) {
              var v = yAcc(d);
              var confLow = lowAcc(d);
              var confHigh = highAcc(d);
              var result = [];

              // Main value with inline confidence interval as relative values
              if (Number.isNaN(v)) {
                result.push(["Wert", "–"]);
              } else {
                var valueText = "".concat(v.toFixed(1), "%");

                // Add confidence interval as relative values if available
                if (confLow && confHigh) {
                  var lowerDiff = (confLow - v).toFixed(0);
                  var upperDiff = (confHigh - v).toFixed(0);
                  valueText += " ("
                    .concat(lowerDiff, "/+")
                    .concat(upperDiff, ")");
                }

                result.push(["Wert", valueText]);
              }

              return result;
            })
            .visible(function (d) {
              return state.selection === d;
            });

          // Rendering
          chartLayer
            .selectGroup("xAxis")
            .attr("transform", sszvis.translateString(0, bounds.innerHeight))
            .call(xAxis);

          chartLayer.selectGroup("yAxis").call(yAxis);

          // Render bars
          var bars = chartLayer
            .selectGroup("bars")
            .datum(state.groupedData)
            .call(barLayout);

          // Add error bars on top of the bars
          chartLayer
            .selectGroup("errorBars")
            .datum(state.groupedData)
            .call(errorBars);

          bars
            .selectAll(".sszvis-barunit rect")
            .on("mouseover", actions.showTooltip)
            .on("mouseout", actions.hideTooltip)
            .call(tooltip);

          // Add legend
          chartLayer
            .selectGroup("colorLegend")
            .attr(
              "transform",
              sszvis.translateString(0, bounds.innerHeight + 60),
            )
            .call(colorLegend);
        }
      })(d3, sszvis, EXTERNAL_CONFIG);
    </script>
  </body>
</html>
