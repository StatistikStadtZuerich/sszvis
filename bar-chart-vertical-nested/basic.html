<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Nested Bar Chart</title>
  </head>
  <body style="margin: 0; padding: 0">
    <link href="../sszvis.css" rel="stylesheet" />
    <script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
    <script src="../sszvis.js"></script>

    <div id="sszvis-chart"></div>

    <script>
      var EXTERNAL_CONFIG = {
        data: "data/nested.csv",
        id: "#sszvis-chart",
        fallback: "fallback.png",
        title: "Beschäftigte nach Berufsfeld und Jahr",
        description:
          "Anteile je Einschätzung nach Jahr und Geschlecht, Altersgruppe 18 bis 29 Jahre.",
      };
    </script>

    <script data-catalog-project-expose="script.js">
      (function (d3, sszvis, config) {
        "use strict";

        /* Configuration
  ----------------------------------------------- */
        var MAX_CONTROL_WIDTH = 300;

        var queryProps = sszvis
          .responsiveProps()
          .prop("targetNumColumns", {
            palm: 1,
            _: 2,
          })
          .prop("bottomPadding", {
            palm: 125,
            _: 100,
          })
          .prop("barPadding", {
            palm: 10,
            _: 12,
          })
          .prop("controlWidth", {
            _: function _(width) {
              return Math.min(width, MAX_CONTROL_WIDTH);
            },
          });

        function parseRow(d) {
          return {
            year: d["Jahr_F"],
            xaxis: d["x"],
            category: d["Auspraegung_F"],
            konfvalue: d["95 % Konfidenzintervall (in %)"],
            value: sszvis.parseNumber(d["Anteil (in %)"]),
            nestedCategory: d["Geschlecht_F"],
            ageGroup: d["Alter_F"],
          };
        }

        /* Shortcuts
  ----------------------------------------------- */
        var xjAcc = sszvis.prop("year");
        var yAcc = sszvis.prop("value");
        var cAcc = sszvis.prop("category");
        var aAcc = sszvis.prop("nestedCategory");
        var AGE_GROUP = "18 bis 29 Jahre";
        var kAcc = sszvis.prop("konfvalue");

        /* Application state
  ----------------------------------------------- */
        var state = {
          data: [],
          nestedCategories: [],
          categories: [],
          stackGroup: [],
          stackedData: [],
          maxStacked: 0,
          selection: [],
        };

        /* State transitions
  ----------------------------------------------- */
        var actions = {
          prepareState: function prepareState(data) {
            // The source data breaks every share down by age as well as by year, gender and
            // answer, and the shares within one age group sum to 100%. Stacking across age
            // groups would therefore add percentages that do not belong in one bar, so the
            // example shows a single age group. Change AGE_GROUP to show another one.
            state.data = data.filter(function (d) {
              return d.ageGroup === AGE_GROUP;
            });

            var stackLayout = sszvis.stackedBarVerticalData(xjAcc, cAcc, yAcc);
            state.stackedData = sszvis
              .cascade()
              .arrayBy(aAcc)
              .apply(state.data)
              .map(function (d) {
                var stack = stackLayout(d);
                stack.key = d[0].nestedCategory;
                return stack;
              });

            state.categories = sszvis.set(state.data, xjAcc);
            state.nestedCategories = sszvis.set(state.data, aAcc);
            state.stackGroup = sszvis.set(state.data, cAcc);

            render(state);
          },

          showTooltip: function showTooltip(_e, datum) {
            state.selection = [datum];
            render(state);
          },
          hideTooltip: function hideTooltip() {
            state.selection = [];
            render(state);
          },

          resize: function resize() {
            render(state);
          },
        };

        /* Data initialization
  ----------------------------------------------- */
        d3.csv(config.data, parseRow)
          .then(actions.prepareState)
          .catch(sszvis.loadError);

        /* Render
  ----------------------------------------------- */
        function render(state) {
          var props = queryProps(sszvis.measureDimensions(config.id));

          var legendLayout = sszvis.colorLegendLayout(
            {
              axisLabels: state.categories,
              legendLabels: state.stackGroup,
              slant: props.xSlant,
            },
            config.id,
          );

          var bounds = sszvis.bounds(
            { top: 10, bottom: props.bottomPadding, left: 10, right: 10 },
            config.id,
          );

          // Scales

          var xaxis2Scale = d3
            .scaleBand()
            .domain(state.nestedCategories)
            .range([50, bounds.innerWidth])
            .paddingInner(0.2)
            .paddingOuter(0);

          var xScale = d3
            .scaleBand()
            .domain(state.categories)
            .range([0, xaxis2Scale.bandwidth()])
            .paddingInner(0.2)
            .paddingOuter(0);

          var yScale = d3
            .scaleLinear()
            .domain([0, 100])
            .range([bounds.innerHeight - 10, 0]);

          var cScale = legendLayout.scale;
          var colorLegend = legendLayout.legend;

          // Layers

          var chartLayer = sszvis
            .createSvgLayer(config.id, bounds, {
              title: "",
              description: "",
            })
            .datum(state.stackedData);

          var tooltipLayer = sszvis
            .createHtmlLayer(config.id)
            .datum(state.selection);

          // Components

          var xAxis = sszvis.axisX
            .ordinal()
            .scale(xaxis2Scale)
            .orient("bottom")
            .tickSize(0)
            .tickFormat(function (d) {
              return d;
            })
            .title(config.xLabel);

          var yAxis = sszvis
            .axisY()
            .scale(yScale)
            .orient("right")
            .title(config.yLabel)
            .ticks(config.ticks)
            .tickFormat(function (d) {
              if (d === 0) {
                return sszvis.formatPercent(d);
              }
              return sszvis.formatPercent(d);
            })
            .dyTitle(-20)
            .title("Anteil");

          var tooltip = sszvis
            .tooltip()
            .renderInto(tooltipLayer)
            .orientation(sszvis.fitTooltip("bottom", bounds))
            .header(
              sszvis
                .modularTextHTML()
                .bold(function (d) {
                  return cAcc(d.data);
                })
                .plain("/")
                .plain(function (d) {
                  return xjAcc(d.data);
                }),
            )
            .body(function (d) {
              return [
                ["Anteil", sszvis.formatPercent(yAcc(d.data))],
                [
                  "95 % Konfidenzintervall",
                  kAcc(d.data).replace(" bis", " % bis") + " %",
                ],
              ];
            })
            .visible(isSelected);

          var xaxis2Group = sszvis
            .nestedStackedBarsVertical()
            .offset(function (d) {
              return xaxis2Scale(d.key);
            })
            .xScale(xScale)
            .xAcc(xjAcc)
            .yScale(yScale)
            .fill(function (d) {
              return cScale(cAcc(d.data));
            })
            .tooltip(tooltip);

          // Rendering

          var nestedCategories = chartLayer
            .selectGroup("age-groups")
            .call(xaxis2Group);

          chartLayer
            .selectGroup("xAxis")
            .attr("transform", sszvis.translateString(0, bounds.innerHeight))
            .call(xAxis)
            .selectAll(".domain")
            .remove();

          chartLayer
            .selectGroup("yAxis")
            .attr("transform", sszvis.translateString(0, 0))
            .call(yAxis);

          chartLayer
            .selectGroup("colorLegend")
            .attr(
              "transform",
              sszvis.translateString(0, bounds.innerHeight + 20),
            )
            .call(colorLegend);

          // Interaction

          var interactionLayer = sszvis
            .panning()
            .elementSelector(".sszvis-bar")
            .on("start", actions.showTooltip)
            .on("pan", actions.showTooltip)
            .on("end", actions.hideTooltip);

          nestedCategories.call(interactionLayer);

          sszvis.viewport.on("resize", actions.resize);
        }

        /* Helper functions
  ----------------------------------------------- */
        function isSelected(d) {
          return sszvis.contains(state.selection, d);
        }
      })(d3, sszvis, EXTERNAL_CONFIG);
    </script>
  </body>
</html>
