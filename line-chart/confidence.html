<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Line Chart | Confidence</title>
  </head>
  <body style="margin: 0; padding: 0">
    <link href="../sszvis.css" rel="stylesheet" />
    <script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
    <script src="../sszvis.js"></script>

    <div id="sszvis-chart"></div>

    <script data-catalog-project-expose="script.js">
      (function (d3, sszvis) {

            _iterableToArray(r) ||
            _unsupportedIterableToArray(r) ||

                    ? { done: !0 }
                    : { done: !1, value: r[_n++] };
                },
                e: function e(r) {
                  throw r;
                },
                f: F,
              };
            }
            throw new TypeError(
              "Invalid attempt to iterate non-iterable instance.\nIn order to be iterable, non-array objects must have a [Symbol.iterator]() method.",
            );
          }
          var o,
            a = !0,
            u = !1;
          return {
            s: function s() {
              t = t.call(r);
            },
            n: function n() {
              var r = t.next();
              return ((a = r.done), r);
            },
            e: function e(r) {
              ((u = !0), (o = r));
            },
            f: function f() {
              try {
                a || null == t.return || t.return();
              } finally {
                if (u) throw o;
              }
            },
          };
        }
        function _unsupportedIterableToArray(r, a) {
          if (r) {
            if ("string" == typeof r) return _arrayLikeToArray(r, a);
            var t = {}.toString.call(r).slice(8, -1);
            return (
              "Object" === t && r.constructor && (t = r.constructor.name),
              "Map" === t || "Set" === t
                ? Array.from(r)
                : "Arguments" === t ||
                    /^(?:Ui|I)nt(?:8|16|32)(?:Clamped)?Array$/.test(t)
                  ? _arrayLikeToArray(r, a)
                  : void 0
            );
          }
        }
        function _arrayLikeToArray(r, a) {
          (null == a || a > r.length) && (a = r.length);
          for (var e = 0, n = Array(a); e < a; e++) n[e] = r[e];
          return n;
        }
        (function (d3, sszvis) {
          "use strict";

          /* Configuration
    ----------------------------------------------- */
          var config = {
            percentage: true,
            yExtentOverride: [0, 101],
            xColumn: "Jahr",
            categoryColumn: "Bildungsstand",
            yTicks: 5,
            yAxisLabel: "",
            yColumn: "Anteil",
            lowerColumn: "unten",
            upperColumn: "oben",
            xAxisLabel: "",
            xTicks: 5,
            targetElement: "#sszvis-chart",
          };

          var queryProps = sszvis
            .responsiveProps()
            .breakpoints([
              { name: "small", width: 280 },
              { name: "narrow", width: 516 },
            ])
            .prop("bottomPadding", {
              small: 130,
              narrow: 100,
              _: 100,
            })
            .prop("xTicks", {
              narrow: 5,
              _: config.xTicks,
            });

          /* Shortcuts
    ----------------------------------------------- */
          var xAcc = sszvis.prop("date");
          var cAcc = sszvis.prop("category");
          var yAcc = sszvis.prop("value");
          var lAcc = sszvis.prop("lower");
          var uAcc = sszvis.prop("upper");

          /* Application state
    ----------------------------------------------- */
          var state = {
            data: [],
            lineData: [],
            dates: [],
            selection: [],
            yExtent: [0, 0],
            categories: [],
            confSelection: [],
          };

          /* State transitions
    ----------------------------------------------- */
          var actions = {
            prepareState: function prepareState(data) {
              state.data = data;
              state.lineData = sszvis
                .cascade()
                .arrayBy(cAcc, d3.ascending)
                .apply(state.data);
              state.dates = d3.extent(state.data, xAcc);
              state.yExtent = d3.extent(state.data, yAcc);

              // trying to prevent an error where the line dissapears
              state.yExtent[0] -= 0.001;

              state.categories = sszvis.set(state.data, cAcc);

              actions.resetDate();
            },
            changeDate: function changeDate(e, inputDate, yVal) {
              // Find the date of the datum closest to the input date
              var datum = closestDatum(state.data, xAcc, inputDate);

              var closestDate = xAcc(datum);
              // Find all data that have the same date as the closest datum

              var closestData = state.lineData.map(function (linePoints) {
                return (
                  // For each line pick the first datum that matches
                  sszvis.find(function (d) {
                    return xAcc(d).toString() === closestDate.toString();
                  }, linePoints)
                );
              });

              var closestToMouse = null;
              var minDist = Number.MAX_VALUE;

              if (yVal) {
                var _iterator = _createForOfIteratorHelper(closestData),
                  _step;
                try {
                  for (_iterator.s(); !(_step = _iterator.n()).done;) {
                    var d = _step.value;
                    if (closestToMouse) {
                      var dist = Math.abs(yAcc(d) - yVal);
                      if (dist < minDist) {
                        minDist = dist;
                        closestToMouse = d;
                      }
                    } else {
                      minDist = Math.abs(yAcc(d) - yVal);
                      closestToMouse = d;
                    }
                  }
                } catch (err) {
                  _iterator.e(err);
                } finally {
                  _iterator.f();
                }
              }

              // Make sure that the selection has a value to display
              state.selection = closestData.filter(
                sszvis.compose(sszvis.not(isNaN), yAcc),
              );

              // for confidence
              state.confSelection = yVal
                ? state.data.filter(function (d) {
                    return cAcc(d) === cAcc(closestToMouse);
                  })
                : [];

              render(state);
            },

            resetDate: function resetDate() {
              state.selection = [];
              render(state);
            },

            resize: function resize() {
              render(state);
            },
          };

          /* Data initialization
    ----------------------------------------------- */
          d3.csv("data/confidence.csv", function (d) {
            return {
              date: sszvis.parseYear(d[config.xColumn]),
              value: sszvis.parseNumber(d[config.yColumn]),
              category: d[config.categoryColumn],
              lower: sszvis.parseNumber(d[config.lowerColumn]),
              upper: sszvis.parseNumber(d[config.upperColumn]),
            };
          })
            .then(actions.prepareState)
            .catch(sszvis.loadError);

          /* Render
    ----------------------------------------------- */
          function render(state) {
            var props = queryProps(
              sszvis.measureDimensions(config.targetElement),
            );
            var bounds = sszvis.bounds(
              {
                top: 60,
                bottom: props.bottomPadding,
              },
              config.targetElement,
            );
            // Scales
            var xScale = d3
              .scaleTime()
              .domain(state.dates)
              .range([0, bounds.innerWidth]);

            var yScale = d3
              .scaleLinear()
              .domain(state.yExtent)
              .range([bounds.innerHeight, 0]);

            var cScale = sszvis.scaleQual6().domain(state.categories);

            // Layers
            var chartLayer = sszvis.createSvgLayer(
              config.targetElement,
              bounds,
              {
                title: "",
                description: "",
              },
            );

            // Components
            var line = sszvis
              .line()
              .x(sszvis.compose(xScale, xAcc))
              .y(sszvis.compose(yScale, yAcc))
              .stroke(sszvis.compose(cScale, cAcc, sszvis.first));

            // for confindence interval
            var area = sszvis
              .annotationConfidenceArea()
              .x(sszvis.compose(xScale, xAcc))
              .y0(sszvis.compose(yScale, lAcc))
              .y1(sszvis.compose(yScale, uAcc))
              .stroke("none")
              .fill("#EAEAEA")
              .transition(false);

            var xTickValues = [].concat(
              _toConsumableArray(xScale.ticks(props.xTicks)),
              _toConsumableArray(state.selection.map(xAcc)),
            );

            var xAxis = sszvis.axisX
              .time()
              .scale(xScale)
              .orient("bottom")
              .tickValues(xTickValues)
              .alignOuterLabels(true)
              .highlightTick(isSelected)
              .title(config.xAxisLabel);

            var yTickValues = config.yTicks
              ? yScale.ticks(config.yTicks)
              : yScale.ticks();
            var showZero = d3.min(yTickValues) !== 0;

            var yAxis = sszvis
              .axisY()
              .tickValues(yTickValues)
              .showZeroY(showZero)
              .tickFormat(function (d) {
                if (d === 0 && !yAxis.showZeroY()) {
                  return null;
                }
                return config.percentage
                  ? sszvis.formatPercent(d)
                  : sszvis.formatNumber(d);
              })
              .scale(yScale)
              .orient("right")
              .contour(true)
              .title(config.yAxisLabel)
              .dyTitle(-20);

            var rulerLabel = sszvis
              .modularTextSVG()
              .bold(function (d) {
                return config.percentage
                  ? sszvis.formatPreciseNumber(1, yAcc(d)) + " %"
                  : sszvis.formatPreciseNumber(1, yAcc(d));
              })
              .plain(function (d) {
                return cAcc(d);
              });

            var highlightLayer = sszvis
              .annotationRuler()
              .top(0)
              .bottom(bounds.innerHeight)
              .x(sszvis.compose(xScale, xAcc))
              .y(sszvis.compose(yScale, yAcc))
              .label(rulerLabel)
              .flip(function (d) {
                return xScale(xAcc(d)) >= bounds.innerWidth / 2;
              })
              .color(sszvis.compose(cScale, cAcc))
              .labelId(cAcc)
              .reduceOverlap(true);

            var cLegend = sszvis
              .legendColorOrdinal()
              .scale(cScale)
              .horizontalFloat(true)
              .floatWidth(bounds.innerWidth);

            // Rendering

            chartLayer
              .selectGroup("area")
              .datum([state.confSelection])
              .call(area);

            chartLayer.selectGroup("line").datum(state.lineData).call(line);

            chartLayer
              .selectGroup("xAxis")
              .attr("transform", sszvis.translateString(0, bounds.innerHeight))
              .call(xAxis);

              .selectGroup("cScale")
              .attr(

                sszvis.translateString(1, bounds.innerHeight + 40),

              .call(cLegend);

              .selectGroup("highlight")
              .datum(state.selection)
              .call(highlightLayer);

              .move()
              .xScale(xScale)
              .yScale(yScale)

              .on("end", actions.resetDate);

          /* Helper functions
    ----------------------------------------------- */

              state.selection.map(xAcc).map(String),

            );
          }
        })(d3, sszvis);
      })(d3, sszvis);
    </script>
  </body>
</html>
