<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Small Multiples | Overlapping Lines Example</title>
  </head>
  <body style="margin: 0; padding: 0">
    <link href="../sszvis.css" rel="stylesheet" />
    <script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
    <script src="../sszvis.js"></script>

    <div id="sszvis-chart"></div>

    <script>
      var EXTERNAL_CONFIG = {
        data: "data/L_multiples.csv",
        id: "#sszvis-chart",
        fallback: "fallback.png",
      };
    </script>

    <script data-catalog-project-expose="script.js">
      (function (d3, sszvis, config) {
        "use strict";

        // Configuration
        // -----------------------------------------------

        var queryProps = sszvis
          .responsiveProps()
          .prop("rulerLabel", {
            _: function _() {
              return sszvis
                .modularTextSVG()
                .bold(
                  sszvis.compose(
                    function (d) {
                      return sszvis.formatPercent(yAcc(d) / 100);
                    },
                    function (d) {
                      return d;
                    },
                  ),
                )
                .plain(cAcc);
            },
          })
          .prop("xLabel", {
            _: "",
          })
          .prop("yLabel", {
            _: "Response rate",
          })
          .prop("ticks", {
            _: 5,
          })
          .prop("colorLegendColumns", {
            palm: 2,
            lap: 3,
            _: 6,
          })
          .prop("colorLegendColumnWidth", {
            palm: function palm(width) {
              return width / 2;
            },
            lap: function lap(width) {
              return width / 3;
            },
            _: function _(width) {
              return width / 4;
            },
          });

        function parseRow(d) {
          // Filter for Stadtkreis data only (not Quartier)
          if (d["Raum"] !== "Stadtkreis") return null;

          return {
            xValue: sszvis.parseNumber(d["Jahr"]),
            yValue: sszvis.parseNumber(d["Wert"]),
            category: d["Kreis"],
            kreisNum: sszvis.parseNumber(d["KreisNum"]),
          };
        }

        var xAcc = sszvis.prop("xValue");
        var yAcc = sszvis.prop("yValue");
        var cAcc = sszvis.prop("category");
        var kreisNumAcc = sszvis.prop("kreisNum");

        // Application state
        // -----------------------------------------------
        var state = {
          data: [],
          lineData: [],
          categories: [],
          xValues: [],
          maxY: 0,
          selection: [],
        };

        // State transitions
        // -----------------------------------------------
        var actions = {
          prepareState: function prepareState(data) {
            // Filter out null values (non-Stadtkreis data)
            var filteredData = data.filter(function (d) {
              return d !== null;
            });

            state.data = filteredData;

            // Group data by category and sort by Kreis number
            var grouped = sszvis
              .cascade()
              .arrayBy(cAcc, d3.ascending)
              .apply(filteredData);

            // Sort groups by Kreis number and then sort each group's values by year
            state.lineData = grouped
              .map(function (g) {
                return {
                  values: g.sort(function (a, b) {
                    return xAcc(a) - xAcc(b);
                  }),
                  kreisNum: kreisNumAcc(g[0]),
                };
              })
              .sort(function (a, b) {
                return a.kreisNum - b.kreisNum;
              })
              .map(function (g) {
                return g.values;
              });

            // Get sorted categories
            state.categories = state.lineData.map(function (g) {
              return cAcc(g[0]);
            });

            // Get x-axis domain (all years)
            state.xValues = d3.extent(filteredData, xAcc);

            // Y-axis domain (0-100 for percentages)
            state.maxY = 100;

            render(state);
          },

          showTooltip: function showTooltip(_e, inputDate) {
            // Find the closest date to the mouse position
            var closestDate = xAcc(closestDatum(state.data, xAcc, inputDate));

            // Find all data points at that date
            var closestData = state.lineData.map(function (linePoints) {
              return sszvis.find(function (d) {
                return xAcc(d).toString() === closestDate.toString();
              }, linePoints);
            });

            state.selection = closestData.filter(
              sszvis.compose(sszvis.not(isNaN), yAcc),
            );
            render(state);
          },

          hideTooltip: function hideTooltip() {
            // Find the most recent date and show that
            var mostRecentDate = d3.max(state.data, xAcc);
            var closestData = state.lineData.map(function (linePoints) {
              return sszvis.find(function (d) {
                return xAcc(d).toString() === mostRecentDate.toString();
              }, linePoints);
            });
            state.selection = closestData.filter(
              sszvis.compose(sszvis.not(isNaN), yAcc),
            );
            render(state);
          },

          resize: function resize() {
            render(state);
          },
        };

        // Data initialization
        // -----------------------------------------------
        d3.csv(config.data, parseRow)
          .then(actions.prepareState)
          .catch(sszvis.loadError);

        // Render
        // -----------------------------------------------
        function render(state) {
          var props = queryProps(sszvis.measureDimensions(config.id));

          var cScale = sszvis.scaleQual12().domain(state.categories);

          var bounds = sszvis.bounds(
            {
              top:
                typeof props.yLabel === "string" && props.yLabel.length > 0
                  ? 30
                  : 10,
              bottom: 100, // Space for legend
            },
            config.id,
          );

          // Scales
          var xScale = d3
            .scaleLinear()
            .domain(state.xValues)
            .range([0, bounds.innerWidth]);

          var yScale = d3
            .scaleLinear()
            .domain([0, state.maxY])
            .range([bounds.innerHeight, 0]);

          // Layers
          var chartLayer = sszvis
            .createSvgLayer(config.id, bounds)
            .datum(state.lineData);

          // Components
          var line = sszvis
            .line()
            .x(sszvis.compose(xScale, xAcc))
            .y(sszvis.compose(yScale, yAcc))
            // Access the first data point of the line to decide on the stroke color
            .stroke(sszvis.compose(cScale, cAcc, sszvis.first));

          // Ruler annotation for hover
          var highlightLayer = sszvis
            .annotationRuler()
            .top(0)
            .bottom(bounds.innerHeight)
            .x(sszvis.compose(xScale, xAcc))
            .y(sszvis.compose(yScale, yAcc))
            .label(props.rulerLabel)
            .flip(function (d) {
              return xScale(xAcc(d)) >= bounds.innerWidth / 2;
            })
            .color(sszvis.compose(cScale, cAcc));

          // Axes
          var xAxis = sszvis
            .axisX()
            .scale(xScale)
            .orient("bottom")
            .tickFormat(d3.format("d"))
            .ticks(props.ticks)
            .highlightTick(function (d) {
              return state.selection.length > 0
                ? String(d) === String(xAcc(state.selection[0]))
                : false;
            })
            .alignOuterLabels(true);

          var yAxis = sszvis
            .axisY()
            .scale(yScale)
            .orient("right")
            .ticks(5)
            .tickFormat(function (d) {
              return d + "%";
            })
            .contour(true)
            .title(props.yLabel)
            .dyTitle(-20);

          // Legend
          var colorLegend = sszvis
            .legendColorOrdinal()
            .scale(cScale)
            .columnWidth(props.colorLegendColumnWidth)
            .columns(props.colorLegendColumns)
            .orientation("horizontal");

          // Rendering
          chartLayer.selectGroup("line").call(line);

          chartLayer
            .selectGroup("xAxis")
            .attr("transform", sszvis.translateString(0, bounds.innerHeight))
            .call(xAxis);

          chartLayer.selectGroup("yAxis").call(yAxis);

          chartLayer
            .selectGroup("colorLegend")
            .attr(
              "transform",
              sszvis.translateString(0, bounds.innerHeight + 40),
            )
            .call(colorLegend);

          chartLayer
            .selectGroup("highlight")
            .datum(state.selection)
            .call(highlightLayer);

          // Interaction
          var interactionLayer = sszvis
            .move()
            .xScale(xScale)
            .yScale(yScale)
            .on("move", actions.showTooltip)
            .on("end", actions.hideTooltip);

          chartLayer.selectGroup("interaction").call(interactionLayer);

          sszvis.viewport.on("resize", actions.resize);
        }

        // Helper functions
        // -----------------------------------------------
        function closestDatum(data, accessor, datum) {
          var i = d3.bisector(accessor).left(data, datum, 1);
          var d0 = data[i - 1];
          var d1 = data[i] || d0;
          return datum - accessor(d0) > accessor(d1) - datum ? d1 : d0;
        }
      })(d3, sszvis, EXTERNAL_CONFIG);
    </script>
  </body>
</html>
