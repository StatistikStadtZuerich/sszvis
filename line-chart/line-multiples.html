<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Small Multiples | Line Chart</title>
  </head>
  <body style="margin: 0; padding: 0">
    <link href="../sszvis.css" rel="stylesheet" />
    <script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
    <script src="../sszvis.js"></script>

    <div id="sszvis-chart"></div>

    <script>
      var EXTERNAL_CONFIG = {
        data: "data/L_multiples.csv",
        id: "#sszvis-chart",
        fallback: "fallback.png",
      };
    </script>

    <script data-catalog-project-expose="script.js">
      (function (d3, sszvis, config) {
        "use strict";

        // Configuration
        // -----------------------------------------------

        var PANEL_PADDING = 30;

        var queryProps = sszvis
          .responsiveProps()
          .prop("rowsCols", {
            palm: [6, 2], // 6 rows x 2 cols on mobile
            lap: [4, 3], // 4 rows x 3 cols on tablet
            _: [3, 4], // 3 rows x 4 cols on desktop
          })
          .prop("colorLegendColumns", {
            palm: 2,
            lap: 3,
            _: 4,
          })
          .prop("colorLegendColumnWidth", {
            palm: function palm(width) {
              return width / 2;
            },
            lap: function lap(width) {
              return width / 3;
            },
            _: function _(width) {
              return width / 4;
            },
          })
          .prop("bounds", {
            palm: function palm() {
              var panelHeight = 140;
              var legendHeight = 80;
              var bottomPadding = 40 + legendHeight;
              return {
                top: 20,
                right: 10,
                bottom: bottomPadding,
                left: 10,
                height:
                  20 + 6 * panelHeight + 5 * PANEL_PADDING + bottomPadding,
              };
            },
            lap: function lap() {
              var panelHeight = 160;
              var legendHeight = 80;
              var bottomPadding = 40 + legendHeight;
              return {
                top: 20,
                right: 20,
                bottom: bottomPadding,
                left: 20,
                height:
                  20 + 4 * panelHeight + 3 * PANEL_PADDING + bottomPadding,
              };
            },
            _: function _() {
              var panelHeight = 180;
              var legendHeight = 80;
              var bottomPadding = 40 + legendHeight;
              return {
                top: 20,
                right: 20,
                bottom: bottomPadding,
                left: 20,
                height:
                  20 + 3 * panelHeight + 2 * PANEL_PADDING + bottomPadding,
              };
            },
          });

        function parseRow(d) {
          // Filter for Stadtkreis data only (not Quartier)
          if (d["Raum"] !== "Stadtkreis") return null;

          return {
            xValue: sszvis.parseNumber(d["Jahr"]),
            yValue: sszvis.parseNumber(d["Wert"]),
            category: d["Kreis"],
            kreisNum: sszvis.parseNumber(d["KreisNum"]),
          };
        }

        var xAcc = sszvis.prop("xValue");
        var yAcc = sszvis.prop("yValue");
        var cAcc = sszvis.prop("category");
        var kreisNumAcc = sszvis.prop("kreisNum");

        // Application state
        // -----------------------------------------------
        var state = {
          data: [],
          categories: [],
          lineGroups: [],
          xValues: [],
          maxY: 0,
          selection: [],
          hoveredCategory: null,
        };

        // State transitions
        // -----------------------------------------------
        var actions = {
          prepareState: function prepareState(data) {
            // Filter out null values (non-Stadtkreis data)
            var filteredData = data.filter(function (d) {
              return d !== null;
            });

            // Group data by category
            var grouped = sszvis
              .cascade()
              .arrayBy(cAcc, d3.ascending)
              .apply(filteredData);

            state.data = filteredData;
            state.categories = sszvis.set(state.data, cAcc);

            // Create line groups with category name and values, sorted by Kreis number
            state.lineGroups = grouped
              .map(function (g) {
                return {
                  category: cAcc(g[0]), // Get category from first item in group
                  values: g.sort(function (a, b) {
                    return xAcc(a) - xAcc(b);
                  }), // Sort by year
                  kreisNum: kreisNumAcc(g[0]),
                };
              })
              .sort(function (a, b) {
                return a.kreisNum - b.kreisNum;
              }); // Sort groups by Kreis number

            // Update categories order to match sorted groups
            state.categories = state.lineGroups.map(function (g) {
              return g.category;
            });

            // Get x-axis domain (all years)
            state.xValues = d3.extent(state.data, xAcc);

            // Get y-axis domain (0-100 for percentages)
            state.maxY = 100;

            render(state);
          },

          showTooltip: function showTooltip(_e, inputDate) {
            // Find the closest date to the mouse position
            var closestDate = xAcc(closestDatum(state.data, xAcc, inputDate));

            // Find all data points at that date
            var closestData = state.lineGroups.map(function (lineGroup) {
              return sszvis.find(function (d) {
                return xAcc(d).toString() === closestDate.toString();
              }, lineGroup.values);
            });

            state.selection = closestData.filter(
              sszvis.compose(sszvis.not(isNaN), yAcc),
            );
            render(state);
          },

          hideTooltip: function hideTooltip() {
            state.selection = [];
            render(state);
          },

          resize: function resize() {
            render(state);
          },
        };

        // Data initialization
        // -----------------------------------------------
        d3.csv(config.data, parseRow)
          .then(actions.prepareState)
          .catch(sszvis.loadError);

        // Render
        // -----------------------------------------------
        function render(state) {
          var props = queryProps(sszvis.measureDimensions(config.id));
          var bounds = sszvis.bounds(props.bounds, config.id);

          // Scales
          var xScale = d3.scaleLinear().domain(state.xValues).range([0, 100]); // Will be scaled per panel
          var yScale = d3.scaleLinear().domain([0, state.maxY]).range([100, 0]); // Will be scaled per panel
          var cScale = sszvis.scaleQual12().domain(state.categories);

          // Layers
          var chart = sszvis
            .createSvgLayer(config.id, bounds)
            .datum(state.lineGroups);

          // Components
          var multiplesMaker = sszvis
            .layoutSmallMultiples()
            .width(bounds.innerWidth)
            .height(bounds.innerHeight - 60) // Leave space for legend
            .paddingX(PANEL_PADDING)
            .paddingY(PANEL_PADDING)
            .rows(props.rowsCols[0])
            .cols(props.rowsCols[1])
            .showTitle(true)
            .titleLabel(function (d) {
              return d.category;
            })
            .titleAnchor("start")
            .titleY(-10);

          var colorLegend = sszvis
            .legendColorOrdinal()
            .scale(cScale)
            .columnWidth(props.colorLegendColumnWidth)
            .columns(props.colorLegendColumns)
            .orientation("horizontal");

          // Rendering
          var panels = chart.selectGroup("panels").call(multiplesMaker);

          // Render a line chart in each panel
          panels.selectAll(".sszvis-multiple").each(function (d) {
            var panelSelection = d3.select(this);

            // Scale the x and y scales to the panel dimensions
            var panelXScale = xScale.copy().range([0, d.gw]);
            var panelYScale = yScale.copy().range([d.gh, 0]);

            // Line component - sszvis.line expects array of arrays
            var line = sszvis
              .line()
              .x(sszvis.compose(panelXScale, xAcc))
              .y(sszvis.compose(panelYScale, yAcc))
              .stroke(cScale(d.category));

            // Axes
            var xAxis = sszvis
              .axisX()
              .scale(panelXScale)
              .orient("bottom")
              .tickFormat(d3.format("d"))
              .ticks(4);

            var yAxis = sszvis
              .axisY()
              .scale(panelYScale)
              .orient("right")
              .ticks(3)
              .tickFormat(function (d) {
                return d + "%";
              })
              .contour(true);

            // Render line - pass data as array of arrays to sszvis.line()
            panelSelection
              .selectAll(".sszvis-multiple-chart")
              .datum([d.values])
              .call(line);

            // Render axes (only on bottom row and left column)
            var panelIndex = state.lineGroups.indexOf(d);
            var row = Math.floor(panelIndex / props.rowsCols[1]);
            var col = panelIndex % props.rowsCols[1];
            var isBottomRow = row === props.rowsCols[0] - 1;
            var isLeftCol = col === 0;

            if (isBottomRow) {
              panelSelection
                .selectAll(".sszvis-multiple-chart")
                .selectAll(".sszvis-axis--x")
                .data([null])
                .join("g")
                .classed("sszvis-axis sszvis-axis--x", true)
                .attr("transform", sszvis.translateString(0, d.gh))
                .call(xAxis);
            }

            if (isLeftCol) {
              panelSelection
                .selectAll(".sszvis-multiple-chart")
                .selectAll(".sszvis-axis--y")
                .data([null])
                .join("g")
                .classed("sszvis-axis sszvis-axis--y", true)
                .call(yAxis);
            }

            // Ruler annotation for hover
            if (state.selection.length > 0) {
              var categorySelection = state.selection.find(function (s) {
                return cAcc(s) === d.category;
              });

              if (categorySelection) {
                var rulerAnnotation = sszvis
                  .annotationRuler()
                  .top(0)
                  .bottom(d.gh)
                  .x(sszvis.compose(panelXScale, xAcc))
                  .y(sszvis.compose(panelYScale, yAcc))
                  .label(
                    sszvis.modularTextSVG().bold(function (d) {
                      return sszvis.formatPercent(yAcc(d) / 100);
                    }),
                  )
                  .flip(function (datum) {
                    return panelXScale(xAcc(datum)) >= d.gw / 2;
                  })
                  .color(cScale(d.category));

                panelSelection
                  .selectAll(".sszvis-multiple-chart")
                  .selectAll(".sszvis-ruler")
                  .data([categorySelection])
                  .join("g")
                  .classed("sszvis-ruler", true)
                  .call(rulerAnnotation);
              }
            } else {
              panelSelection
                .selectAll(".sszvis-multiple-chart")
                .selectAll(".sszvis-ruler")
                .remove();
            }
          });

          // Legend
          chart
            .selectGroup("colorLegend")
            .attr(
              "transform",
              sszvis.translateString(0, bounds.innerHeight - 40),
            )
            .call(colorLegend);

          // Interaction
          var interactionLayer = sszvis
            .move()
            .xScale(xScale)
            .yScale(yScale)
            .on("move", actions.showTooltip)
            .on("end", actions.hideTooltip);

          panels.call(interactionLayer);

          sszvis.viewport.on("resize", actions.resize);
        }

        // Helper functions
        // -----------------------------------------------
        function closestDatum(data, accessor, datum) {
          var i = d3.bisector(accessor).left(data, datum, 1);
          var d0 = data[i - 1];
          var d1 = data[i] || d0;
          return datum - accessor(d0) > accessor(d1) - datum ? d1 : d0;
        }
      })(d3, sszvis, EXTERNAL_CONFIG);
    </script>
  </body>
</html>
