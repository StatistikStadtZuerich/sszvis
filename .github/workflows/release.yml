name: Release

on:
  push:
    branches:
      - master

# One release at a time: two runs versioning the same changesets would race on
# the Version Packages branch and could publish the same version twice.
concurrency: release-${{ github.ref }}

jobs:
  version:
    name: "Version"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
      version: ${{ steps.resolve.outputs.version }}
      tag-exists: ${{ steps.resolve.outputs.tag-exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # changeset version reads the history to attribute entries to commits.
          fetch-depth: 0

      - name: Install Dependencies
        uses: ./.github/actions/setup

      # Opens or updates the "Version Packages" pull request. It deliberately has
      # no `publish` input: publishing goes through the `publish` job below,
      # which uses `npm publish --provenance` over OIDC. `changeset publish`
      # shells out to the package manager and would drop the provenance
      # attestation.
      - name: Create or update the Version Packages pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run changeset:version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the library version and whether it is already released
        id: resolve
        run: |
          version="$(node -p "require('./packages/sszvis/package.json').version")"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "tag-exists=true" >>"$GITHUB_OUTPUT"
          else
            echo "tag-exists=false" >>"$GITHUB_OUTPUT"
          fi

  # These steps are deliberately inlined rather than kept in a reusable workflow
  # called with `uses:`. npm's trusted publishing matches the OIDC token against
  # the workflow registered for the package, and a `workflow_call` presents the
  # caller's workflow reference instead — the exchange then fails, npm falls back
  # to an anonymous request and rejects the publish with a 404. The trusted
  # publisher on npmjs.com must therefore name this file, `release.yml`.
  publish:
    name: "Publish"
    needs: version
    # Reached when a Version Packages pull request has landed: the changesets are
    # consumed, the manifest carries a version, and nothing has published it yet.
    if: needs.version.outputs.has-changesets == 'false' && needs.version.outputs.tag-exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        uses: ./.github/actions/setup

      - run: pnpm run check
      - run: pnpm run type-check
      - run: pnpm --filter sszvis exec playwright install --with-deps
      - run: pnpm run test
      - run: pnpm run build

      - name: Verify the version matches the one the release resolved
        run: test "$(node -p "require('./package.json').version")" = "${{ needs.version.outputs.version }}"
        working-directory: packages/sszvis

      # `npm publish`, not `pnpm publish`: npm implements OIDC trusted publishing,
      # so this needs no NPM_TOKEN and keeps the provenance attestation. pnpm
      # cannot do the OIDC exchange and would silently drop provenance.
      - name: Publish sszvis
        run: npm publish --access public --provenance
        working-directory: packages/sszvis

  tag:
    name: "Tag"
    needs:
      - version
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # After the publish, so a failed publish leaves the version re-releasable.
      # The tag is a record of the release, not a trigger for it: a GITHUB_TOKEN
      # push does not start workflows, and the publish above has already run.
      - name: Tag the release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --verify-tag --generate-notes
