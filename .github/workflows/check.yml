name: "Check"

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  check:
    name: "Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        uses: ./.github/actions/setup

      - name: Run Check
        run: pnpm run check

  verify-types:
    name: "Types"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        uses: ./.github/actions/setup

      - name: Verify Types
        run: pnpm run type-check

  unit-test:
    needs:
      - check
      - verify-types
    name: "Unit Test"
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        uses: ./.github/actions/setup

      - name: Install Playwright
        run: pnpm --filter sszvis exec playwright install --with-deps

      - name: Run Component Tests
        run: pnpm run test:unit

  snapshot-test:
    needs:
      - check
      - verify-types
    name: "Snapshot Test"
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        uses: ./.github/actions/setup

      - name: Install Playwright
        run: pnpm --filter sszvis exec playwright install --with-deps

      - name: Build library and docs
        run: pnpm run build

      - name: Serve docs and run snapshot tests
        run: |
          pnpm exec concurrently -k -s first -n "DOC,TEST" -c "magenta,blue" \
            "pnpm --filter @sszvis/docs run serve" \
            "pnpm exec wait-on http://localhost:8000 && pnpm --filter sszvis run test:snapshot"
