name: "Check"

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      # So the changeset gate re-runs when `no-changeset` is added or removed.
      - labeled
      - unlabeled

jobs:
  check:
    name: "Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        uses: ./.github/actions/setup

      - name: Run Check
        run: pnpm run check

  changeset:
    name: "Changeset"
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/master' && !contains(github.event.pull_request.labels.*.name, 'no-changeset')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # `changeset status --since` diffs against the base branch, so the
          # shallow default checkout is not enough.
          fetch-depth: 0

      - name: Install Dependencies
        uses: ./.github/actions/setup

      # Fails when packages/sszvis/src changed and no .changeset entry describes
      # it. `changedFilePatterns` in .changeset/config.json defines "changed";
      # label a pull request `no-changeset` to opt out.
      - name: Verify a changeset describes the change
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}

  verify-types:
    name: "Types"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        uses: ./.github/actions/setup

      - name: Verify Types
        run: pnpm run type-check

  unit-test:
    needs:
      - check
      - verify-types
    name: "Unit Test"
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        uses: ./.github/actions/setup

      - name: Install Playwright
        run: pnpm --filter sszvis exec playwright install --with-deps

      - name: Run Unit Tests
        run: pnpm run test

  snapshot-test:
    needs:
      - check
      - verify-types
    name: "Snapshot Test"
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        uses: ./.github/actions/setup

      - name: Install Playwright
        run: pnpm --filter sszvis exec playwright install --with-deps

      - name: Build library and docs
        run: pnpm run build

      # playwright.config.js owns the docs server via its `webServer` block.
      - name: Run snapshot tests
        run: pnpm run test:snapshot
