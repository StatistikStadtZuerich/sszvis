name: Publish to NPM
on:
  workflow_dispatch:
  push:
    tags:
      - v[0-9].*
  # Called by release.yml once a Version Packages PR has landed. A tag pushed by
  # GITHUB_TOKEN does not trigger workflows, so the release cannot rely on the
  # `push: tags` trigger above to reach this job — it invokes it directly.
  workflow_call:
    inputs:
      expected-version:
        description: The packages/sszvis version this run is expected to publish.
        required: true
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        uses: ./.github/actions/setup

      - run: pnpm run check
      - run: pnpm run type-check
      - run: pnpm --filter sszvis exec playwright install --with-deps
      - run: pnpm run test
      - run: pnpm run build

      # `npm publish`, not `pnpm publish`: npm implements OIDC trusted publishing,
      # so this needs no NPM_TOKEN and keeps the provenance attestation. pnpm
      # cannot do the OIDC exchange and would silently drop provenance.
      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.ref_name }}"
        working-directory: packages/sszvis

      - name: Verify the version matches the one the release resolved
        if: inputs.expected-version != ''
        run: test "$(node -p "require('./package.json').version")" = "${{ inputs.expected-version }}"
        working-directory: packages/sszvis

      - name: Publish sszvis
        run: npm publish --access public --provenance
        working-directory: packages/sszvis
