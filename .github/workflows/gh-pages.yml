name: GitHub Pages
on:
  push:
    branches:
      - master

# A second push while a deploy is in flight would race it to the gh-pages branch.
concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Dependencies
        uses: ./.github/actions/setup
      - name: Build
        run: pnpm run build
      # Belt and braces: nothing in the output is underscore-prefixed except the
      # Cloudflare _headers file, but this stops Jekyll touching the 11ty output.
      - name: Disable Jekyll
        run: touch apps/docs/dist/.nojekyll
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@releases/v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: apps/docs/dist
