name: GitHub Pages
on:
  push:
    branches:
      - master

# A second push while a deploy is in flight would race it to the gh-pages branch.
concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Dependencies
        uses: ./.github/actions/setup
      - name: Build
        run: pnpm run build
        env:
          DOCS_BASE: /sszvis/
      # The previous docs served these at its root, and its guides cite /topo/.
      - name: Keep the previous site's public files
        run: |
          cp packages/sszvis/build/sszvis.{js,js.map,min.js,min.js.map,css} apps/docs/build/client/
          cp -R packages/geodata/dist/topo apps/docs/build/client/topo
      # Jekyll would drop the underscore-prefixed preview/_assets and preview/_static.
      - name: Disable Jekyll
        run: touch apps/docs/build/client/.nojekyll
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@releases/v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: apps/docs/build/client
