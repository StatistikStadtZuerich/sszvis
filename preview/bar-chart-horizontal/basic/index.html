<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Horizontal Bar Chart</title>
    <link href="/sszvis/preview/_assets/sszvis.css" rel="stylesheet" />
    <style>
      /*
       * sszvis draws for a light page: its text and axes are dark and it sets
       * no background of its own. Without this the standalone page inherits the
       * browser's dark preference and the chart is drawn dark-on-dark.
       */
      html {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        background: #fff;
      }
      /*
       * Breathing room inside the frame: embedded in the docs the page is the
       * chart, and a chart drawn flush to the edge collides with the frame's
       * own border. `box-sizing` keeps the padding inside the width the chart
       * measures itself against, so it still fits the viewport it is given.
       */
      body {
        box-sizing: border-box;
        padding: 24px;
      }
      /*
       * A chart's marks are not always inside its bounds: sszvis places a point
       * at its value and draws the symbol around it, so the outer half of an
       * edge bubble - up to the largest radius - falls outside the SVG, which
       * clips at its own viewport. Letting the SVG paint outside puts that
       * overhang in the padding above rather than slicing it off.
       *
       * The viewport still clips, which matters: a chart given less width than
       * it was written for can run far past its bounds (the overlapping line
       * chart lays out ~240px of labels off its right edge at 800px), and that
       * has to stay out of sight rather than stretching the page sideways.
       */
      svg {
        overflow: visible;
      }
      html {
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <div id="sszvis-chart"></div>

    <script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
    <script src="/sszvis/preview/_assets/sszvis.js"></script>
    <script>
      var config = {
  "data": "data.csv",
  "id": "#sszvis-chart",
  "fallback": "../../_static/fallback.png"
};
    </script>
    <script>
      /**
       * Basic horizontal bar chart example using sszvis.
       *
       * @sszvis   3.5.1
       * @chart    bar-chart-horizontal
       * @features tooltip
       * @date     2026-09-14
       */

      // Magic Numbers

      const MAX_WIDTH = 800;
      /** In the x scale's own domain units - employees - not pixels. */
      const BAR_TOUCH_THRESHOLD = 1000;
      const SERIES_KEY = "Zupendler";

      // Types

      // Responsive Props

      const queryProps = sszvis
        .responsiveProps()
        .prop("xLabel", { _: "Beschäftigte" })
        .prop("ticks", { palm: 4, _: 5 });

      // Accessors

      const xAcc = (d) => d.xValue;
      const cAcc = (d) => d.category;

      // Application

      sszvis.app({
        fallback: { element: config.id, src: config.fallback },

        init: (state) =>
          d3
            .csv(config.data, (d) => ({
              category: d["Sektor"] ?? "",
              xValue: sszvis.parseNumber(d["Zupendler"]),
            }))
            .then((data) => {
              state.data = data;
              state.categories = sszvis.set(data, cAcc);
              state.selection = [];
            }),

        actions: {
          showTooltip(state, _e, _xValue, category) {
            state.selection = state.data.filter((d) => cAcc(d) === category);
          },

          hideTooltip(state) {
            state.selection = [];
          },
        },

        // Render
        render(state, actions) {
          const props = queryProps(sszvis.measureDimensions(config.id));
          const chartDimensions = sszvis.dimensionsHorizontalBarChart(state.categories.length);
          const bounds = sszvis.bounds(
            {
              height: 30 + chartDimensions.totalHeight + 40,
              top: 30,
              bottom: 40,
            },
            config.id,
          );
          const chartWidth = Math.min(bounds.innerWidth, MAX_WIDTH);

          // Scales

          const widthScale = d3
            .scaleLinear()
            .range([0, chartWidth])
            .domain([0, d3.max(state.data, xAcc) ?? 0]);

          const yScale = d3
            .scaleBand()
            .padding(chartDimensions.padRatio)
            .paddingOuter(chartDimensions.outerRatio)
            .rangeRound([0, chartDimensions.totalHeight])
            .domain(state.categories);

          // NOTE: One series, so one colour: the categories are already named on the y axis
          const barFill = sszvis.scaleQual12()(SERIES_KEY);

          // Layers

          const chartLayer = sszvis.createSvgLayer(config.id, bounds, {
            title: "Zupendler nach Sektor",
            description: "Anzahl Zupendlerinnen und Zupendler je Wirtschaftssektor.",
          });
          chartLayer.datum(state.data);

          const tooltipLayer = sszvis.createHtmlLayer(config.id, bounds).datum(state.selection);

          // Components

          const barGen = sszvis
            .bar()
            .x(0)
            .y((d) => yScale(cAcc(d)) ?? 0)
            .width((d) => widthScale(xAcc(d)))
            .height(chartDimensions.barHeight)
            .centerTooltip(true)
            .fill(barFill);

          const xAxis = sszvis
            .axisX()
            .scale(widthScale)
            .orient("bottom")
            .alignOuterLabels(true)
            .ticks(props.ticks)
            .title(props.xLabel);

          const yAxis = sszvis.axisY.ordinal().scale(yScale).orient("right");

          const tooltipHeader = sszvis
            .modularTextHTML()
            .bold((d) => {
              const value = xAcc(d);
              return Number.isNaN(value) ? "k. A." : sszvis.formatNumber(value);
            })
            .plain(props.xLabel);

          const tooltip = sszvis
            .tooltip()
            .renderInto(tooltipLayer)
            .orientation(sszvis.fitTooltip("bottom", bounds))
            .header(tooltipHeader)
            .visible((d) => sszvis.contains(state.selection, d));

          // Rendering

          chartLayer.attr(
            "transform",
            sszvis.translateString(bounds.innerWidth / 2 - chartWidth / 2, bounds.padding.top),
          );

          const bars = chartLayer.selectGroup("bars").call(barGen);

          chartLayer
            .selectGroup("xAxis")
            .attr("transform", sszvis.translateString(0, chartDimensions.totalHeight))
            .call(xAxis);

          chartLayer
            .selectGroup("yAxis")
            .attr("transform", sszvis.translateString(0, chartDimensions.axisOffset))
            .call(yAxis);

          bars.selectAll("[data-tooltip-anchor]").call(tooltip);

          // Interaction

          const interactionLayer = sszvis
            .move()
            .xScale(widthScale)
            .yScale(yScale)
            .cancelScrolling(isWithinBarContour(state))
            .fireOnPanOnly(true)
            .on("move", actions.showTooltip)
            .on("end", actions.hideTooltip);

          chartLayer.selectGroup("interaction").call(interactionLayer);
        },
      });

      // Helper functions

      /**
       * On touch devices, scrolling is cancelled while the cursor is over a bar, so
       * that a pan gesture reads as a tooltip query. Bars that are very short, or
       * that have no value at all, are still reachable within
       * `BAR_TOUCH_THRESHOLD` of the zero line.
       */
      const isWithinBarContour = (state) => (xValue, category) => {
        if (xValue == null || category == null) {
          return false;
        }
        const barDatum = state.data.find((d) => cAcc(d) === category);
        if (barDatum === undefined) {
          return false;
        }
        return Number.isNaN(xAcc(barDatum))
          ? xValue < BAR_TOUCH_THRESHOLD
          : xValue < Math.max(xAcc(barDatum), BAR_TOUCH_THRESHOLD);
      };
    </script>
  </body>
</html>
