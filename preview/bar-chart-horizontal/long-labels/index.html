<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Horizontal Bar Chart — Long Labels</title>
    <link href="/sszvis/preview/_assets/sszvis.css" rel="stylesheet" />
    <style>
      /*
       * sszvis draws for a light page: its text and axes are dark and it sets
       * no background of its own. Without this the standalone page inherits the
       * browser's dark preference and the chart is drawn dark-on-dark.
       */
      html {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        background: #fff;
      }
      /*
       * Breathing room inside the frame: embedded in the docs the page is the
       * chart, and a chart drawn flush to the edge collides with the frame's
       * own border. `box-sizing` keeps the padding inside the width the chart
       * measures itself against, so it still fits the viewport it is given.
       */
      body {
        box-sizing: border-box;
        padding: 24px;
      }
      /*
       * A chart's marks are not always inside its bounds: sszvis places a point
       * at its value and draws the symbol around it, so the outer half of an
       * edge bubble - up to the largest radius - falls outside the SVG, which
       * clips at its own viewport. Letting the SVG paint outside puts that
       * overhang in the padding above rather than slicing it off.
       *
       * The viewport still clips, which matters: a chart given less width than
       * it was written for can run far past its bounds (the overlapping line
       * chart lays out ~240px of labels off its right edge at 800px), and that
       * has to stay out of sight rather than stretching the page sideways.
       */
      svg {
        overflow: visible;
      }
      html {
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <div id="sszvis-chart"></div>

    <script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
    <script src="/sszvis/preview/_assets/sszvis.js"></script>
    <script>
      var config = {
  "data": "data.csv",
  "id": "#sszvis-chart",
  "fallback": "../../_static/fallback.png"
};
    </script>
    <script>
      /**
       * Horizontal bar chart whose button group carries long, multi-word labels.
       *
       * @sszvis   3.5.1
       * @chart    bar-chart-horizontal
       * @features button-group
       * @date     2026-09-14
       */

      // Magic Numbers

      const MAX_WIDTH = 800;
      const MAX_CONTROL_WIDTH = 500;
      // NOTE: This example exists to exercise the button group with many options and
      // long, multi-word labels: each option only gets `width / values.length` of the
      // control's width, so the labels wrap onto several lines inside their buttons.
      const CATEGORIES = [
        "Nahrungsmittel und Papier",
        "Chemie und Metall",
        "Maschinen und Geräte",
        "Wasser und Energie",
        "Gross- und Detailhandel",
        "Immobilien, Informatik",
        "Gesundheits- und Sozialwesen",
      ];
      // NOTE: One series, so one colour: the categories are already named on the y axis.
      const SERIES_KEY = "Zupendler";

      // Types

      // Responsive Props

      const queryProps = sszvis.responsiveProps().prop("controlWidth", {
        _: (width) => Math.min(width, MAX_CONTROL_WIDTH),
      });

      // Accessors

      const xAcc = (d) => d.xValue;
      const cAcc = (d) => d.category;

      // Application

      sszvis.app({
        fallback: { element: config.id, src: config.fallback },

        init: (state) =>
          d3
            .csv(config.data, (d) => ({
              category: d["Sektor"] ?? "",
              xValue: sszvis.parseNumber(d["Zupendler"]),
            }))
            .then((data) => {
              state.data = data.filter((d) => CATEGORIES.includes(cAcc(d)));
              state.categories = sszvis.set(state.data, cAcc);
              state.selectedCategory = CATEGORIES[0] ?? "";
            }),

        actions: {
          selectCategory(state, _e, category) {
            state.selectedCategory = category;
          },
        },

        render(state, actions) {
          const chartDimensions = sszvis.dimensionsHorizontalBarChart(state.categories.length);
          const bounds = sszvis.bounds(
            { height: 120 + chartDimensions.totalHeight + 40, top: 120, bottom: 40 },
            config.id,
          );
          const props = queryProps(bounds);
          const chartWidth = Math.min(bounds.innerWidth, MAX_WIDTH);

          // Scales

          const widthScale = d3
            .scaleLinear()
            .range([0, chartWidth])
            .domain([0, d3.max(state.data, xAcc) ?? 0]);

          const yScale = d3
            .scaleBand()
            .padding(chartDimensions.padRatio)
            .paddingOuter(chartDimensions.outerRatio)
            .rangeRound([0, chartDimensions.totalHeight])
            .domain(state.categories);

          const cScale = sszvis.scaleQual12().domain([SERIES_KEY]);
          const barFill = cScale(SERIES_KEY);
          const barFillHighlight = cScale.darker()(SERIES_KEY);

          // Layers

          const chartLayer = sszvis
            .createSvgLayer(config.id, bounds, {
              title: "Zupendler nach Sektor",
              description: "Anzahl Zupendlerinnen und Zupendler je Wirtschaftssektor.",
            })
            .datum(state.data);

          const controlLayer = sszvis.createHtmlLayer(config.id, bounds);

          // Components

          const barGen = sszvis
            .bar()
            .x(0)
            .y((d) => yScale(cAcc(d)) ?? 0)
            .width((d) => widthScale(xAcc(d)))
            .height(chartDimensions.barHeight)
            .fill((d) => (cAcc(d) === state.selectedCategory ? barFillHighlight : barFill));

          const xAxis = sszvis.axisX().scale(widthScale).orient("bottom").alignOuterLabels(true).ticks(5);

          const yAxis = sszvis.axisY
            .ordinal()
            .scale(yScale)
            .orient("right")
            .highlightTick((d) => d === state.selectedCategory);

          const buttonGroup = sszvis
            .buttonGroup()
            .values(CATEGORIES)
            .width(props.controlWidth)
            .current(state.selectedCategory)
            .change(actions.selectCategory)
            .ariaLabel("Sektor");

          // Rendering

          chartLayer.attr(
            "transform",
            sszvis.translateString(bounds.innerWidth / 2 - chartWidth / 2, bounds.padding.top),
          );

          chartLayer.selectGroup("bars").call(barGen);

          chartLayer
            .selectGroup("xAxis")
            .attr("transform", sszvis.translateString(0, chartDimensions.totalHeight))
            .call(xAxis);

          chartLayer
            .selectGroup("yAxis")
            .attr("transform", sszvis.translateString(0, chartDimensions.axisOffset))
            .call(yAxis);

          controlLayer
            .selectDiv("controls")
            .style("left", `${Math.max(0, (bounds.innerWidth - buttonGroup.width()) / 2)}px`)
            .style("top", `${20 - bounds.padding.top}px`)
            .call(buttonGroup);
        },
      });
    </script>
  </body>
</html>
