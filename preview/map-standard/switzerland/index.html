<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map — Schweiz</title>
    <link href="/sszvis/preview/_assets/sszvis.css" rel="stylesheet" />
    <style>
      /*
       * sszvis draws for a light page: its text and axes are dark and it sets
       * no background of its own. Without this the standalone page inherits the
       * browser's dark preference and the chart is drawn dark-on-dark.
       */
      html {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        background: #fff;
      }
      /*
       * Breathing room inside the frame: embedded in the docs the page is the
       * chart, and a chart drawn flush to the edge collides with the frame's
       * own border. `box-sizing` keeps the padding inside the width the chart
       * measures itself against, so it still fits the viewport it is given.
       */
      body {
        box-sizing: border-box;
        padding: 24px;
      }
      /*
       * A chart's marks are not always inside its bounds: sszvis places a point
       * at its value and draws the symbol around it, so the outer half of an
       * edge bubble - up to the largest radius - falls outside the SVG, which
       * clips at its own viewport. Letting the SVG paint outside puts that
       * overhang in the padding above rather than slicing it off.
       *
       * The viewport still clips, which matters: a chart given less width than
       * it was written for can run far past its bounds (the overlapping line
       * chart lays out ~240px of labels off its right edge at 800px), and that
       * has to stay out of sight rather than stretching the page sideways.
       */
      svg {
        overflow: visible;
      }
      html {
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <div id="sszvis-chart"></div>

    <script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
    <script src="/sszvis/preview/_assets/sszvis.js"></script>
    <script>
      var config = {
  "data": "data.csv",
  "id": "#sszvis-chart",
  "fallback": "../../_static/fallback.png"
};
    </script>
    <script>
      /**
       * Choropleth map of the Swiss cantons on a diverging colour scale.
       *
       * @sszvis   3.5.1
       * @chart    map-standard
       * @features legend
       * @date     2026-09-14
       */

      // Magic Numbers

      const MAX_LEGEND_WIDTH = 320;
      /** Cap on the map's inner height in px, so it stays legible on wide screens. */
      const MAX_MAP_HEIGHT = 400;
      /** Vertical padding in px below the map, which holds the legend. */
      const LEGEND_PADDING = 40;
      /** Gap in px between the bottom of the map and the legend. */
      const LEGEND_GUTTER = 25;
      const TOPO_URL = "../../_static/topo/switzerland.json";

      // Types

      // Responsive Props

      const queryProps = sszvis
        .responsiveProps()
        .prop("bounds", {
          _: (width) => {
            const innerHeight = Math.min(sszvis.aspectRatio4to3(width), MAX_MAP_HEIGHT);
            return {
              bottom: LEGEND_PADDING,
              height: innerHeight + LEGEND_PADDING,
            };
          },
        })
        .prop("legendWidth", {
          _: (width) => Math.min(width / 2, MAX_LEGEND_WIDTH),
        });

      // Accessors

      const vAcc = (d) => d.value;

      // Application

      sszvis.app({
        fallback: { element: config.id, src: config.fallback },

        // NOTE: The chart needs both the values and the geometry, so it loads them
        // together; `app()` renders nothing until `init` has resolved.
        init: (state) =>
          Promise.all([
            d3.csv(config.data, (d) => ({
              geoId: sszvis.parseNumber(d["KantonNr"]),
              value: sszvis.parseNumber(d["Wert"]),
            })),
            d3.json(TOPO_URL),
          ]).then(([data, topo]) => {
            if (topo === undefined) {
              throw new Error(`No topology at ${TOPO_URL}`);
            }
            state.data = data;
            state.mapData = {
              features: topojson.feature(topo, topo.objects["cantons"]),
              borders: topojson.mesh(topo, topo.objects["cantons"]),
            };
            state.valueDomain = [0, d3.max(data, vAcc) ?? 0];
          }),

        render(state) {
          const props = queryProps(sszvis.measureDimensions(config.id));
          const bounds = sszvis.bounds(props.bounds, config.id);

          // Scales

          const colorScale = sszvis.scaleDivNtrGry().domain(state.valueDomain);

          // Layers

          const chartLayer = sszvis
            .createSvgLayer(config.id, bounds, {
              title: "Geschlechterverhältnis nach Kanton",
              description: "Anteil Frauen und Männer je Kanton, auf einer divergierenden Farbskala.",
            })
            .datum(state.data);

          // Components

          const choroplethMap = sszvis
            .choropleth()
            .features(state.mapData.features)
            .borders(state.mapData.borders)
            .width(bounds.innerWidth)
            .height(bounds.innerHeight)
            // NOTE: A feature that matched no datum gets the missing-value texture and
            // never reaches this accessor, so the undefined branch is only here to name
            // the case the signature allows.
            .fill((d) => (d === undefined ? "none" : colorScale(vAcc(d))))
            .defined((d) => d !== undefined && !Number.isNaN(vAcc(d)));

          const legend = sszvis
            .legendColorLinear()
            .scale(colorScale)
            .width(props.legendWidth)
            .labelText(["Frauen", "Männer"]);

          // Rendering

          chartLayer
            .attr("transform", sszvis.translateString(bounds.padding.left, bounds.padding.top))
            .call(choroplethMap);

          chartLayer
            .selectGroup("legend")
            .attr(
              "transform",
              sszvis.translateString(
                bounds.width / 2 - props.legendWidth / 2,
                bounds.innerHeight + LEGEND_GUTTER,
              ),
            )
            .call(legend);
        },
      });
    </script>
  </body>
</html>
