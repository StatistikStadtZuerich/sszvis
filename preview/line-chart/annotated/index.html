<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Line Chart — Annotated</title>
    <link href="/sszvis/preview/_assets/sszvis.css" rel="stylesheet" />
    <style>
      /*
       * sszvis draws for a light page: its text and axes are dark and it sets
       * no background of its own. Without this the standalone page inherits the
       * browser's dark preference and the chart is drawn dark-on-dark.
       */
      html {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        background: #fff;
      }
      /*
       * Breathing room inside the frame: embedded in the docs the page is the
       * chart, and a chart drawn flush to the edge collides with the frame's
       * own border. `box-sizing` keeps the padding inside the width the chart
       * measures itself against, so it still fits the viewport it is given.
       */
      body {
        box-sizing: border-box;
        padding: 24px;
      }
      /*
       * A chart's marks are not always inside its bounds: sszvis places a point
       * at its value and draws the symbol around it, so the outer half of an
       * edge bubble - up to the largest radius - falls outside the SVG, which
       * clips at its own viewport. Letting the SVG paint outside puts that
       * overhang in the padding above rather than slicing it off.
       *
       * The viewport still clips, which matters: a chart given less width than
       * it was written for can run far past its bounds (the overlapping line
       * chart lays out ~240px of labels off its right edge at 800px), and that
       * has to stay out of sight rather than stretching the page sideways.
       */
      svg {
        overflow: visible;
      }
      html {
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <div id="sszvis-chart"></div>

    <script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
    <script src="/sszvis/preview/_assets/sszvis.js"></script>
    <script>
      var config = {
  "data": "data.csv",
  "id": "#sszvis-chart",
  "fallback": "../../_static/fallback.png"
};
    </script>
    <script>
      /**
       * Line chart example with a circular annotation highlighting a single day.
       *
       * @sszvis   3.5.1
       * @chart    line-chart
       * @features annotation
       * @date     2026-09-14
       */

      // Magic Numbers

      // NOTE: The chart shows a single series, so the whole line takes one palette
      // colour; this is the ordinal scale's only key.
      const SERIES_KEY = "Regen";
      /** Days singled out by the circle annotation, matched on the parsed date. */
      const HIGHLIGHTED_DATES = [new Date(2013, 10, 10)];
      /** Radius of the annotation circle in pixels. */
      const ANNOTATION_RADIUS = 20;
      /** Vertical offset of the annotation caption from the circle's centre, in pixels. */
      const ANNOTATION_CAPTION_OFFSET = -30;

      // Types

      // NOTE: The chart is not interactive, so it declares no actions; the type is
      // still named, so that `app()` reports a mistyped dispatcher as an error.

      // Responsive Props

      const queryProps = sszvis
        .responsiveProps()
        .prop("xLabel", { _: "Datum" })
        .prop("yLabel", { _: "Regen" });

      // Accessors

      const xAcc = (d) => d.date;
      const yAcc = (d) => d.value;

      // Application

      sszvis.app({
        fallback: { element: config.id, src: config.fallback },

        init: (state) =>
          d3
            .csv(config.data, (d) => {
              const date = sszvis.parseDate(d["Datum"]);
              // NOTE: A row whose date cannot be parsed has no position on the time
              // axis; returning null from the row callback drops it from the data.
              return date === null ? null : { date, value: sszvis.parseNumber(d["Regen"]) };
            })
            .then((data) => {
              state.data = data;
              state.dates = [d3.min(data, xAcc) ?? new Date(), d3.max(data, xAcc) ?? new Date()];
              // NOTE: The line component draws an array of lines, and this chart has one.
              state.lineData = [data];
              state.annotatedData = data.filter((d) =>
                sszvis.contains(HIGHLIGHTED_DATES.map(String), String(xAcc(d))),
              );
            }),

        render(state) {
          const props = queryProps(sszvis.measureDimensions(config.id));
          const bounds = sszvis.bounds({ top: 30, bottom: 45 }, config.id);

          // Scales

          const xScale = d3.scaleTime().domain(state.dates).range([0, bounds.innerWidth]);

          const yScale = d3
            .scaleLinear()
            .domain([0, d3.max(state.data, yAcc) ?? 0])
            .range([bounds.innerHeight, 0]);

          // Layers

          const chartLayer = sszvis
            .createSvgLayer(config.id, bounds, {
              title: "Niederschlag in der Stadt Zürich",
              description: "Tägliche Regenmenge im November 2013.",
            })
            .datum(state.lineData);

          // Components

          const line = sszvis
            .line()
            .x((d) => xScale(xAcc(d)))
            .y((d) => yScale(yAcc(d)))
            .stroke(String(sszvis.scaleQual12()(SERIES_KEY)));

          const xAxis = sszvis.axisX.time().scale(xScale).orient("bottom").title(props.xLabel);

          const yAxis = sszvis
            .axisY()
            .scale(yScale)
            .orient("right")
            .contour(true)
            .title(props.yLabel)
            .dyTitle(-20);

          const annotation = sszvis
            .annotationCircle()
            .x((d) => xScale(xAcc(d)))
            .y((d) => yScale(yAcc(d)))
            .r(ANNOTATION_RADIUS)
            .dy(ANNOTATION_CAPTION_OFFSET)
            .caption((d) => `Referenzwert A (${yAcc(d)})`);

          // Rendering

          chartLayer.selectGroup("annotation").datum(state.annotatedData).call(annotation);

          chartLayer.selectGroup("line").call(line);

          chartLayer
            .selectGroup("xAxis")
            .attr("transform", sszvis.translateString(0, bounds.innerHeight))
            .call(xAxis);

          chartLayer.selectGroup("yAxis").call(yAxis);
        },
      });
    </script>
  </body>
</html>
